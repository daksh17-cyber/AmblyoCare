<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AmblyoCare</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px;
            background: #f5f7fa;
        }

        h1 {
            font-size: 40px;
        }

        video {
            width: 100%;
            max-width: 700px;
            border-radius: 16px;
            margin-top: 20px;
            display: none;
            transform: scaleX(-1);
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
        }

        #status,
        #visionStatus {
            margin-top: 20px;
            font-size: 18px;
        }

        #faceStatus {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <h1>AmblyoCare</h1>

    <h2>Computer Vision for Amblyopia Therapy Support</h2>

    <p>
        A research prototype exploring how computer vision
        could support amblyopia therapy compliance.
    </p>

    <button id="startButton">
        Start Session
    </button>

    <p id="status">
        Session not started.
    </p>

    <p id="visionStatus">
        Vision system waiting.
    </p>

    <p id="faceStatus">
        Face detection waiting.
    </p>

    <video id="camera" autoplay playsinline></video>


    <script>

        const button =
            document.getElementById("startButton");

        const video =
            document.getElementById("camera");

        const status =
            document.getElementById("status");

        const visionStatus =
            document.getElementById("visionStatus");

        const faceStatus =
            document.getElementById("faceStatus");


        let faceLandmarker = null;

        let lastVideoTime = -1;


        button.addEventListener(
            "click",
            startSession
        );


        // ==========================================
        // START CAMERA
        // ==========================================

        async function startSession() {

            status.textContent =
                "Starting camera...";

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "user"
                        },

                        audio: false

                    });


                video.srcObject = stream;

                video.style.display = "block";


                status.textContent =
                    "Camera active. Session started.";


                // Camera is confirmed.
                // Now start computer vision.

                loadFaceLandmarker();


            } catch (error) {

                console.error(error);

                status.textContent =
                    "Camera access was not granted.";

                faceStatus.textContent =
                    "Camera error.";

            }

        }


        // ==========================================
        // LOAD MEDIAPIPE
        // ==========================================

        async function loadFaceLandmarker() {

            visionStatus.textContent =
                "Loading face detection model...";


            try {

                const vision =
                    await import(
                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
                    );


                const FilesetResolver =
                    vision.FilesetResolver;

                const FaceLandmarker =
                    vision.FaceLandmarker;


                const filesetResolver =
                    await FilesetResolver.forVisionTasks(

                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"

                    );


                faceLandmarker =
                    await FaceLandmarker.createFromOptions(

                        filesetResolver,

                        {

                            baseOptions: {

                                modelAssetPath:
                                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

                            },

                            runningMode: "VIDEO",

                            numFaces: 1

                        }

                    );


                visionStatus.textContent =
                    "Computer vision ready.";

                faceStatus.textContent =
                    "Face detection starting...";


                detectFace();


            } catch (error) {

                console.error(
                    "Face model error:",
                    error
                );


                visionStatus.textContent =
                    "Computer vision model failed.";

                faceStatus.textContent =
                    "Error loading face detection.";

            }

        }


        // ==========================================
        // FACE DETECTION LOOP
        // ==========================================

        function detectFace() {

            if (!faceLandmarker) {
                return;
            }


            if (
                video.readyState >= 2 &&
                video.currentTime !== lastVideoTime
            ) {

                lastVideoTime =
                    video.currentTime;


                try {

                    const results =
                        faceLandmarker.detectForVideo(

                            video,

                            performance.now()

                        );


                    if (
                        results.faceLandmarks &&
                        results.faceLandmarks.length > 0
                    ) {

                        faceStatus.textContent =
                            "🟢 Face detected";

                    } else {

                        faceStatus.textContent =
                            "🔴 No face detected";

                    }

                } catch (error) {

                    console.error(
                        "Detection error:",
                        error
                    );

                }

            }


            requestAnimationFrame(
                detectFace
            );

        }

    </script>

</body>
</html>
