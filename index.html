<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmblyoCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 25px;
            background: #f5f7fa;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 5px;
        }

        video {
            width: 100%;
            max-width: 700px;
            border-radius: 16px;
            margin-top: 20px;
            display: none;
            transform: scaleX(-1);
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        #details {
            margin-top: 10px;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <h1>AmblyoCare</h1>

    <h2>Computer Vision for Amblyopia Therapy Support</h2>

    <p>
        A research prototype exploring how computer vision
        could support amblyopia therapy compliance.
    </p>

    <button id="startButton">Start Session</button>

    <div id="status">Session not started.</div>
    <div id="details"></div>

    <video id="camera" autoplay playsinline></video>

    <!-- MediaPipe Tasks Vision -->
    <script type="module">

        import {
            FaceLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

        const startButton = document.getElementById("startButton");
        const video = document.getElementById("camera");
        const status = document.getElementById("status");
        const details = document.getElementById("details");

        let faceLandmarker;
        let lastVideoTime = -1;

        async function createFaceLandmarker() {

            status.textContent = "Loading computer vision model...";

            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
            );

            faceLandmarker = await FaceLandmarker.createFromOptions(
                vision,
                {
                    baseOptions: {
                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                        delegate: "GPU"
                    },

                    runningMode: "VIDEO",

                    numFaces: 1
                }
            );
        }

        async function startCamera() {

            try {

                startButton.disabled = true;

                await createFaceLandmarker();

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: "user"
                        },
                        audio: false
                    });

                video.srcObject = stream;
                video.style.display = "block";

                status.textContent =
                    "Camera active — looking for your face.";

                detectFace();

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Something went wrong. Check camera permission.";

                startButton.disabled = false;
            }
        }

        function detectFace() {

            if (
                video.readyState >= 2 &&
                video.currentTime !== lastVideoTime
            ) {

                lastVideoTime = video.currentTime;

                const results =
                    faceLandmarker.detectForVideo(
                        video,
                        performance.now()
                    );

                if (
                    results.faceLandmarks &&
                    results.faceLandmarks.length > 0
                ) {

                    status.textContent = "🟢 Face detected";
                    details.textContent =
                        "Facial landmarks are being tracked.";

                } else {

                    status.textContent = "🔴 No face detected";
                    details.textContent =
                        "Move into the camera view.";
                }
            }

            requestAnimationFrame(detectFace);
        }

        startButton.addEventListener(
            "click",
            startCamera
        );

    </script>

</body>
</html>
