<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AmblyoCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px;
            background: #f5f7fa;
        }

        h1 {
            font-size: 40px;
        }

        video {
            width: 100%;
            max-width: 700px;
            border-radius: 16px;
            margin-top: 20px;
            display: none;
            transform: scaleX(-1);
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
        }

        #status {
            margin-top: 20px;
            font-size: 18px;
        }

        #visionStatus {
            margin-top: 10px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>AmblyoCare</h1>

    <h2>Computer Vision for Amblyopia Therapy Support</h2>

    <p>
        A research prototype exploring how computer vision
        could support amblyopia therapy compliance.
    </p>

    <button id="startButton">Start Session</button>

    <p id="status">Session not started.</p>

    <p id="visionStatus">Vision system waiting.</p>

    <video id="camera" autoplay playsinline></video>


    <script>

        const button = document.getElementById("startButton");
        const video = document.getElementById("camera");
        const status = document.getElementById("status");
        const visionStatus = document.getElementById("visionStatus");


        button.addEventListener("click", startSession);


        async function startSession() {

            // Immediately show that the button worked.
            status.textContent = "Starting camera...";
            visionStatus.textContent = "Vision system waiting.";


            try {

                // CAMERA ONLY.
                // No AI library is loaded here.

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: "user"
                        },
                        audio: false
                    });


                video.srcObject = stream;
                video.style.display = "block";


                status.textContent =
                    "Camera active. Session started.";

                visionStatus.textContent =
                    "Camera confirmed. Ready for computer vision.";


                /*
                 * IMPORTANT:
                 *
                 * We are deliberately NOT loading MediaPipe yet.
                 *
                 * This proves that our button + camera
                 * remain independent from the AI system.
                 */


            } catch (error) {

                console.error(error);

                status.textContent =
                    "Camera access was not granted.";

                visionStatus.textContent =
                    "Camera error: " + error.message;

            }

        }

    </script>

</body>
</html>
